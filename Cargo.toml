# Standalone — see top-level Cargo.toml for why it's not a workspace member.
# This crate ships the library-only surface used by the B1 adapter. Upstream
# shipped server/CLI/ethereum-db/mmap scaffolding; the Raven fork stripped
# that surface because (a) the B1 adapter consumes only the library, and
# (b) those modules carry transitive tokio/axum/reqwest deps that break
# wasm32-unknown-unknown. Detached workspace; built explicitly with:
#   cargo build --manifest-path crates/raven-inspire/Cargo.toml --release
[workspace]

[package]
name = "raven-inspire"
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.85"
description = "Raven's fork of inspire-rs (igor53627) with Raven-local patches for known upstream issues and client-side query-path caching."
license = "Apache-2.0"
authors = ["Raven contributors", "Original inspire-rs authors (see UPSTREAM.md)"]
publish = false
readme = "README.md"

# Lint posture: adapter code calls into ported upstream APIs. The upstream
# code uses .unwrap() / panic! in several places; we relax these lints to
# match upstream's posture rather than edit every call site. Raven-local
# new code should still use typed errors.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
pedantic = "allow"
all = "allow"

[dependencies]
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
byteorder = "1.5"

# Parallelism
rayon = "1.10"

# Cryptographic primitives
rand = "0.8"
rand_chacha = "0.3"

# Hex encoding
hex = "0.4"

# Bucket index (for setup)
tiny-keccak = { version = "2.0", features = ["keccak"] }

[dev-dependencies]
proptest = "1.4"
