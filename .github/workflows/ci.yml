name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_DIR: /tmp/sccache
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - name: Test (quick PR path)
        if: github.event_name == 'pull_request'
        run: cargo test --all --lib --bins

      - name: Test (full)
        if: github.event_name != 'pull_request'
        run: cargo test --all

      - name: Bench (sizes only)
        if: github.event_name != 'pull_request'
        env:
          INSPIRE_BENCH_SIZES_ONLY: "1"
        run: cargo bench --bench query_size_latency

      - name: sccache stats
        if: always()
        continue-on-error: true
        run: command -v sccache >/dev/null && sccache --show-stats || true

  commit-msg-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR commit messages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          pattern='^(feat|fix|docs|chore|refactor|test|ci|style|perf|build)(\([a-zA-Z0-9_/ -]+\))?\!?: .+'
          failed=0
          while IFS= read -r msg; do
            # Allow merge commits and fixup/squash/amend prefixes
            if echo "$msg" | grep -qE '^Merge '; then continue; fi
            if echo "$msg" | grep -qE '^(fixup|squash|amend)! '; then continue; fi
            if echo "$msg" | grep -qE "$pattern"; then continue; fi
            echo "BAD: $msg"
            failed=1
          done < <(git log --format='%s' "$base".."$head")
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Commit messages must follow Conventional Commits: <type>[(<scope>)][!]: <description>"
            echo "Types: feat, fix, docs, chore, refactor, test, ci, style, perf, build"
            exit 1
          fi

  clippy:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_DIR: /tmp/sccache
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - name: Clippy
        run: cargo clippy --all-targets -- -W clippy::all

      - name: sccache stats
        if: always()
        continue-on-error: true
        run: command -v sccache >/dev/null && sccache --show-stats || true
