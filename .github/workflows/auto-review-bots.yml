name: Auto Review Bots

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  request-bot-review:
    if: ${{ !github.event.pull_request.draft && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Request automated re-review (once per head SHA)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const marker = `<!-- auto-review-bots:${pr.head.sha} -->`;
            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            if (comments.some((c) => c.body?.includes(marker))) {
              core.info(`Review ping already posted for ${pr.head.sha}`);
              return;
            }

            const body = `${marker}
Automated review ping for \`${pr.head.ref}@${pr.head.sha.slice(0, 7)}\`.

/gemini review
@coderabbitai review`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });

            core.info("Posted automated review request comment.");
